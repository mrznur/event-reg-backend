# Fly.io configuration for event-reg-backend
# Docs: https://fly.io/docs/reference/configuration/

app = "event-reg-backend"
primary_region = "sin" # Singapore — closest to Bangladesh

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
